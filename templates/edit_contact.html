<!DOCTYPE html>
<html>
<head>
    <title>Edit Contact</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Edit Contact</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul class="flash-messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('edit_contact', contact_id=contact.id) }}">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ contact.name }}">
        <br>

        <label for="email">Email:</label>
        <input type="text" id="email" name="email" value="{{ contact.email }}">
        <br>

        <label for="phone">Phone:</label>
        <input type="text" id="phone" name="phone" value="{{ contact.phone }}">
        <br>

        <button type="submit">Update Contact</button>
    </form>

    <a href="{{ url_for('index') }}">Back to Contacts</a>

</body>
</html>
